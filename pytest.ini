# The engine's unit suites: sphinx/_scripts/_tests and sphinx/_extensions/_tests.
# The sphinx.testing plugin is loaded here and not in a conftest.py: pytest
# accepts `pytest_plugins` only in a top-level conftest, and with two suites
# neither conftest is top-level in a run of both.
[pytest]
addopts = -p sphinx.testing.fixtures
testpaths =
    sphinx/_scripts/_tests
    sphinx/_extensions/_tests
